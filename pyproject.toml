[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snoorthka-refusal_boundary_coverage_map"
version = "0.1.0"
description = "把候选项映射到类别上，算出大模型训练平台工程师·拒答边界与过度拒答的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "snoorthka" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://snoorthka.github.io"
Repository = "https://github.com/snoorthka/refusal_boundary_coverage_map"
Issues = "https://github.com/snoorthka/refusal_boundary_coverage_map/issues"

[project.scripts]
refusal_boundary_coverage_map = "refusal_boundary_coverage_map:main"

[tool.setuptools]
py-modules = ["refusal_boundary_coverage_map"]
